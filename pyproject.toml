[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tritopic"
version = "2.3.0"
description = "TriTopic: Tri-Modal Graph Topic Modeling with Iterative Refinement — state-of-the-art topic modeling that outperforms BERTopic, LDA, and NMF across all standard benchmarks."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Roman Egger", email = "roman.egger@smartvisions.at"}
]
maintainers = [
    {name = "Roman Egger", email = "roman.egger@smartvisions.at"}
]
keywords = [
    "topic-modeling",
    "nlp",
    "natural-language-processing",
    "machine-learning",
    "graph-clustering",
    "leiden-algorithm",
    "consensus-clustering",
    "embeddings",
    "sentence-transformers",
    "text-analysis",
    "text-mining",
    "text-clustering",
    "document-clustering",
    "bertopic-alternative",
    "topic-model",
    "unsupervised-learning",
    "graph-neural-network",
    "multi-view-learning",
    "iterative-refinement",
    "coherence",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "sentence-transformers>=2.2.0",
    "leidenalg>=0.9.0",
    "igraph>=0.10.0",
    "umap-learn>=0.5.0",
    "hdbscan>=0.8.0",
    "plotly>=5.0.0",
    "tqdm>=4.60.0",
    "rank-bm25>=0.2.0",
    "keybert>=0.7.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
# Drop-in C++ replacement for scipy.cluster.hierarchy.linkage used by the
# legacy "hierarchical" consensus path.  Not required for the default
# "graph" consensus method.
legacy-consensus = [
    "fastcluster>=1.2.0",
]
llm = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
]
# Adaptive kNN backend.  When installed, GraphBuilder uses hnswlib HNSW for
# corpora at/above ``hnsw_small_threshold`` (default 5,000 docs) instead of
# the exact sklearn NearestNeighbors path.  Output shape and downstream
# graph construction are identical regardless of which backend ran.
fast-knn = [
    "hnswlib>=0.7.0",
]
full = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "pacmap>=0.6.0",
    "datamapplot>=0.1.0",
    "hnswlib>=0.7.0",
    "torch>=2.0.0",
    "faiss-cpu>=1.7.4",
]
# GPU acceleration extras
# -------------------------
# gpu: FAISS for fast (optionally GPU-accelerated) kNN graph construction +
#      torch for GPU cosine-similarity and embedding refinement.
#      Install: pip install "tritopic[gpu]"
#      faiss-cpu is the pip default; on a CUDA machine swap it out with:
#        pip install faiss-gpu
gpu = [
    "torch>=2.0.0",
    "faiss-cpu>=1.7.4",
]
# gpu-umap: RAPIDS cuML for GPU UMAP and GPU MiniBatchKMeans.
#           cuML is distributed via conda, not pip — install it separately:
#             conda install -c rapidsai -c conda-forge cuml=24.06 cuda-version=12.0
#           Once cuml is in your environment, tritopic will use it automatically.
#           This extra is intentionally empty (no pip-installable dep) so that
#           `pip install "tritopic[gpu-umap]"` does not fail on non-CUDA machines.
gpu-umap = []
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
# Real-world integration tests: 20 Newsgroups + sentence-transformers.
# Embeddings are cached after the first run so subsequent runs are fast.
integration = [
    "sentence-transformers>=2.2.0",
]
benchmark = [
    "bertopic>=0.16.0",
    "datasets>=2.14.0",
]

[project.urls]
Homepage = "https://www.smartvisions.at"
Documentation = "https://github.com/SmartVisions-AI/tritopic/blob/main/docs/docs.md"
Repository = "https://github.com/SmartVisions-AI/tritopic"
Issues = "https://github.com/SmartVisions-AI/tritopic/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["tritopic*"]

[tool.setuptools.package-data]
tritopic = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: tests that take >30 s (6k+ docs, HNSW path, sentence-transformers)",
]
